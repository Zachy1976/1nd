<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog Proyek - Dev Daily</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header / Navigasi -->
  <header>
    <div class="logo">MyPortfolio</div>
    <nav>
      <ul>
        <li><a href="#home">Beranda</a></li>
        <li><a href="#projects">Proyek</a></li>
        <li><a href="#about">Tentang</a></li>
      </ul>
    </nav>
  </header>

  <!-- Hero Section -->
  <section id="home" class="hero">
    <h1>Selamat Datang di Hub Proyek</h1>
    <p>Kumpulan eksperimen dan mini-project hasil ngoding harian.</p>
  </section>

  <!-- Main Content: Tempat nampilin data dari JSON -->
  <main>
    <section id="projects" class="project-section">
      <h2>Daftar Proyek</h2>
      
      <!-- Container yang nanti diisi data dari JSON pake JS -->
      <div id="project-container" class="project-grid">
        <!-- Tempat data JSON dirender -->
        <p class="loading">Memuat data proyek...</p>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 Dibuat dengan HTML, CSS, & JS.</p>
  </footer>

  <!-- Script JS buat fetch data.json -->
  <script src="script.js"></script>
</body>
</html>
