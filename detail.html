<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Proyek - Dev Daily</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header / Navigasi -->
  <header>
    <div class="logo">MyPortfolio</div>
    <nav>
      <ul>
        <li><a href="index.html">← Kembali ke Beranda</a></li>
      </ul>
    </nav>
  </header>

  <!-- Main Content: Detail Proyek -->
  <main>
    <article class="detail-container">
      <header class="detail-header">
        <h1 id="project-title">Memuat Judul...</h1>
        <div id="project-tech" class="tech-stack" style="margin-top: 0.5rem; display: flex; gap: 0.5rem; flex-wrap: wrap;"></div>
        
        <!-- Social Share Container -->
<div style="margin-top: 2rem; display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap;">
  <span style="font-size: 0.85rem; color: var(--text-muted);">Bagikan:</span>
  <button id="share-wa" style="background: #25D366; color: white; border: none; padding: 0.3rem 0.7rem; border-radius: 0.4rem; font-size: 0.8rem; cursor: pointer;">WhatsApp</button>
  <button id="share-tw" style="background: #1DA1F2; color: white; border: none; padding: 0.3rem 0.7rem; border-radius: 0.4rem; font-size: 0.8rem; cursor: pointer;">Twitter/X</button>
  <button id="share-li" style="background: #0A66C2; color: white; border: none; padding: 0.3rem 0.7rem; border-radius: 0.4rem; font-size: 0.8rem; cursor: pointer;">LinkedIn</button>
</div>
      </header>

      <!-- Tombol Dengarkan Deskripsi -->
<button id="tts-btn" style="background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-main); padding: 0.35rem 0.75rem; border-radius: 0.5rem; font-size: 0.8rem; cursor: pointer; display: inline-flex; align-items: center; gap: 0.4rem; margin-top: 0.5rem;">
  🔊 <span>Dengarkan</span>
</button>
      
      <!-- Reading Progress Bar -->
<div id="read-progress" style="position: fixed; top: 0; left: 0; height: 3px; background: var(--primary-color); width: 0%; z-index: 9999; transition: width 0.1s ease-out;"></div>

      <hr style="border: none; border-top: 1px solid var(--border-color); margin: 2rem 0;">

      <section class="detail-body">
        <h2>Deskripsi Proyek</h2>
        <p id="project-description" style="color: var(--text-muted); line-height: 1.8; margin-top: 0.5rem;">
          Memuat deskripsi lengkap...
        </p>
      </section>

      <div style="margin-top: 3rem;">
        <a id="project-link" href="#" target="_blank" class="btn-link">Kunjungi Repo / Live Demo ↗</a>
      </div>
    </article>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 Dibuat dengan HTML, CSS, & JS.</p>
  </footer>

<!-- Toast Notification untuk Copy Link -->
  <div id="toast" class="toast hidden">Link berhasil disalin! 📋</div>

  <!-- Script khusus halaman detail -->
  <script src="detail.js"></script>
</body>
</html>
